<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc">
<title id="title">KMC、电场与外部电路的逐事件耦合框图</title><desc id="desc">初始化后，桥接状态触发细丝电阻计算，求解泊松方程并排除自势，然后计算事件速率，用两个随机数抽等待时间和事件，更新构型，检查终止或返回循环。按原图 2.6 展开重绘。</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4c6075"/></marker></defs>
<rect width="1120" height="1160" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#162b40">
<text x="34" y="41" font-size="25" font-weight="600">KMC 框图：构型改变后，电场与事件速率都要更新</text>
<text x="34" y="75" font-size="17" fill="#58697d">按原图 2.6 重绘；展开了局部位点、输出和多轨迹统计。自势只排除一次。</text>
<g stroke="#bfcdda" stroke-width="1.3" fill="#edf3f8">
