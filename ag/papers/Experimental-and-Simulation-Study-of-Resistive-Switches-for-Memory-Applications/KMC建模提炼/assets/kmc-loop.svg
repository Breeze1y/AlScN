<g text-anchor="middle" font-size="21">
<text x="550" y="143">初始化：几何、状态、事件参数、驱动，t = 0</text>
<text x="550" y="243">金属已桥接两极？</text>
<text x="930" y="230" font-size="19">计算细丝各层电阻</text><text x="930" y="257" font-size="19">更新电路与层电压</text>
<text x="550" y="352">施加电边界，FDM 解泊松方程</text><text x="550" y="380" font-size="19">∇²φ = −ρcharge / ε</text>
<text x="550" y="469">排除事件自势，取得跃迁的局部势差</text>
<text x="550" y="563">识别位点并枚举所有允许事件</text><text x="550" y="593" font-size="19">查询 Ea；计算 Γi 与 Γtotal = ΣΓi</text>
<text x="550" y="671">随机数 u1：抽取等待时间并推进 t</text><text x="550" y="697" font-size="19">Δt = −ln(u1) / Γtotal</text>
<text x="550" y="784">独立随机数 u2：按累计速率选一个事件</text>
<text x="550" y="876">执行事件：更新原子、离子、连接和边界</text><text x="550" y="904" font-size="19">记录电流、形貌及桥接 / 断裂时刻</text>
<text x="550" y="1009">达到停止条件？</text>
<text x="930" y="999" font-size="19">输出一条轨迹</text><text x="930" y="1025" font-size="18">换随机种子，收集分布</text>
</g>
<text x="739" y="220" font-size="18">是</text><text x="567" y="310" font-size="18">否</text>
<text x="739" y="987" font-size="18">是</text><text x="329" y="987" font-size="18">否</text>
<text x="57" y="620" font-size="18" transform="rotate(-90 57 620)">构型变化 → 重新求场 → 重新计算竞争速率</text>
<line x1="34" y1="1093" x2="1086" y2="1093" stroke="#d9e0e8"/>
<text x="34" y="1128" font-size="17" fill="#58697d">研究过生长时：桥接后继续运行。研究 RESET 时：反向驱动，持续更新直到断裂及所需后续时刻。</text>
</g></svg>
