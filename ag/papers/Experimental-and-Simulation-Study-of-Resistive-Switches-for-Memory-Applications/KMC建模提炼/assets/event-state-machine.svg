<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
<title id="title">KMC 事件状态图</title><desc id="desc">中性金属与吸附离子由氧化还原连接，吸附离子与体相离子由脱附吸附连接，离子还可以表面扩散或体扩散。所有合法事件竞争，不强制顺序执行。</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#465b70"/></marker></defs>
<rect width="1160" height="560" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#162b40">
<text x="32" y="43" font-size="25" font-weight="600">同一套事件库：可逆反应与离子运动共同竞争</text>
<text x="32" y="77" font-size="17" fill="#58697d">数字对应原图 2.2；每个位置、每个允许方向都贡献具体事件实例。</text>
<rect x="34" y="205" width="280" height="125" rx="9" fill="#f7eed9" stroke="#dec999"/>
<text x="174" y="249" font-size="23" text-anchor="middle">中性金属 M⁰</text><text x="174" y="284" font-size="18" text-anchor="middle">电极或沉积细丝</text>
<rect x="440" y="205" width="280" height="125" rx="9" fill="#fcece7" stroke="#e6c3b8"/>
<text x="580" y="249" font-size="23" text-anchor="middle">吸附离子 M_ads⁺</text><text x="580" y="284" font-size="18" text-anchor="middle">金属表面，仍带电</text>
<rect x="846" y="205" width="280" height="125" rx="9" fill="#edf2f8" stroke="#c8d4e3"/>
<text x="986" y="249" font-size="23" text-anchor="middle">体相离子 M_bulk⁺</text><text x="986" y="284" font-size="18" text-anchor="middle">介质输运位点</text>
<g stroke="#465b70" stroke-width="2" fill="none" marker-end="url(#head)">
<line x1="315" y1="229" x2="438" y2="229"/><line x1="439" y1="305" x2="316" y2="305"/>
<line x1="721" y1="229" x2="844" y2="229"/><line x1="845" y1="305" x2="722" y2="305"/>
<path d="M502 205V143H657V203"/><path d="M908 330V402H1063V332"/>
</g>
<text x="376" y="214" font-size="17" text-anchor="middle">氧化 1–3</text>
<text x="376" y="341" font-size="17" text-anchor="middle">还原 4–6</text>
<text x="783" y="214" font-size="17" text-anchor="middle">脱附 8</text>
<text x="783" y="341" font-size="17" text-anchor="middle">吸附 7</text>
<text x="580" y="127" font-size="18" text-anchor="middle">表面扩散 10：换表面位置</text>
<text x="986" y="435" font-size="18" text-anchor="middle">体扩散 9：换介质位点</text>
<line x1="33" y1="472" x2="1127" y2="472" stroke="#d9e0e8"/>
<text x="34" y="507" font-size="19">SET 净路径：氧化 → 脱附 → 体扩散 → 吸附 → 表面重排 / 还原 → 沉积</text>
<text x="34" y="538" font-size="17" fill="#58697d">每轮只抽一个事件；离子可以回跳、再脱附或在原处还原。RESET 由反偏改变净方向。</text>
</g></svg>
