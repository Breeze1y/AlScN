<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">二维格点、粒子状态与表面位点示意</title><desc id="desc">左侧示意电极和介质，右侧表示低配位突起、台阶及凹位。此图是复现说明，论文未指定晶格和格距。</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="2" fill="#c5cdd8"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#44556b"/></marker></defs>
<rect width="1160" height="720" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#162b40">
<text x="36" y="42" font-size="25" font-weight="600">二维位点与状态：必须把“带电”与“已沉积”分开</text>
<text x="36" y="75" font-size="17" fill="#58697d">复现示意；原文没有指定晶格类型、格距或邻居数。矩形点阵仅用于说明。</text>
<rect x="45" y="125" width="630" height="370" rx="4" fill="#f3f6fa"/>
<rect x="45" y="125" width="630" height="370" fill="url(#dots)"/>
<rect x="45" y="125" width="630" height="57" fill="#d5a840"/>
<text x="65" y="161" font-size="19">活性金属电极：SET 时为阳极（+）</text>
<rect x="45" y="440" width="630" height="55" fill="#aecbbf"/>
<text x="65" y="477" font-size="19">惰性电极基底：SET 时为阴极（−）</text>
<path d="M175 440V400H203V372H231V344H259V372H287V400H315V440Z" fill="#d5a840"/>
<text x="70" y="417" font-size="17">沉积 M⁰</text>
<circle cx="245" cy="322" r="11" fill="#e36c57"/><text x="282" y="327" font-size="18">M_ads⁺：表面吸附</text>
<text x="282" y="353" font-size="16" fill="#58697d">仍带电</text>
<circle cx="548" cy="270" r="11" fill="#e36c57"/><text x="570" y="261" font-size="18">M_bulk⁺</text>
<text x="570" y="287" font-size="16" fill="#58697d">体相输运</text>
<line x1="548" y1="297" x2="548" y2="345" stroke="#44556b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="568" y="331" font-size="16">体跳跃</text>
<line x1="24" y1="187" x2="24" y2="434" stroke="#44556b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="36" y="524" font-size="18">原文：介质厚 10 nm；每层电极 150 个原子；二维 FDM 求场</text>
<text x="715" y="143" font-size="21" font-weight="600">局部环境决定反应能垒</text>
<g fill="#d5a840"><rect x="722" y="220" width="342" height="28"/><rect x="831" y="192" width="28" height="28"/></g>
<circle cx="845" cy="179" r="10" fill="#e36c57"/>
<text x="719" y="282" font-size="18">adatom：突起 / 低配位位置</text>
<g fill="#d5a840"><rect x="722" y="365" width="342" height="28"/><rect x="722" y="337" width="140" height="28"/></g>
<circle cx="875" cy="351" r="10" fill="#e36c57"/>
<text x="719" y="427" font-size="18">step：台阶边缘位置</text>
<g fill="#d5a840"><rect x="722" y="510" width="342" height="28"/><rect x="722" y="482" width="140" height="28"/><rect x="890" y="482" width="174" height="28"/></g>
<circle cx="876" cy="496" r="10" fill="#e36c57"/>
<text x="719" y="572" font-size="18">hole：表面凹位 / 几何填补位</text>
<text x="719" y="600" font-size="16" fill="#58697d">不是电子空穴，也不是氧空位</text>
<line x1="36" y1="635" x2="1124" y2="635" stroke="#d9e0e8"/>
<rect x="45" y="661" width="20" height="20" fill="#d5a840"/><text x="76" y="678" font-size="17">中性活性金属</text>
<circle cx="290" cy="671" r="10" fill="#e36c57"/><text x="312" y="678" font-size="17">带电金属离子</text>
<rect x="524" y="661" width="20" height="20" fill="#aecbbf"/><text x="555" y="678" font-size="17">惰性基底</text>
<text x="762" y="678" font-size="17" fill="#58697d">具体配位判据需由复现者补充</text>
</g></svg>
